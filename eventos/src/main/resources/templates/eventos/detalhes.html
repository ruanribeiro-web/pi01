<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
<meta charset="UTF-8">
<title>Eventos</title>
</head>
<body>
	<div th:replace="~{menu :: menu}"></div>

	<div class="container">
		<h1>Detalhes do Evento</h1>

		<div class="row">
			<div class="col s12 m6 l12">
				<div class="card">
					<div class="card-content">
						<span class="card-title">Informações</span>
						<p>
							<strong>Id: </strong><span th:text="${evento.id}">1</span>
						</p>
						<p>
							<strong>Nome: </strong><span th:text="${evento.nome}">Aniversário
								de José</span>
						</p>
						<p>
							<strong>Local: </strong><span th:text="${evento.local}">Club</span>
						</p>
						<p>
							<strong>Data: </strong><span th:text="${evento.data}">25/02/2021</span>
						</p>
						<p>
							<strong>Horário: </strong><span th:text="${evento.horario}">20:00</span>
						</p>
					</div>
				</div>
			</div>
		</div>

		<div class="card">
			<div class="card-content">
				<span class="card-title">Adicionar Convidado</span>
				<form th:action="@{/eventos/{idEvento}(idEvento=${evento.id})}"
					method="post">
					<div class="input-field">
						<input type="text" name="nome" id="nome"> <label
							for="nome">Nome</label>
					</div>
					<div class="input-field">
						<input type="text" name="rg" id="rg"> <label for="rg">RG</label>
					</div>
					<div>
						<button class="waves-effect waves-light btn" type="submit">Salvar</button>
						<button class="waves-effect waves-light btn" type="reset">Limpar</button>
					</div>
				</form>
			</div>
		</div>

		<div class="row">
			<div class="col s12 m6 l12">
				<div class="card">
					<div class="card-content">
						<span class="card-title">Convidados</span>
						<table class="highlight">
							<thead>
								<tr>
									<th>Id</th>
									<th>Nome</th>
									<th>RG</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="c : ${convidados}">
									<td th:text="${c.id}">1</td>
									<td th:text="${c.nome}">Fernando Soares</td>
									<td th:text="${c.rg}">123</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>

	</div>

</body>
</html>
